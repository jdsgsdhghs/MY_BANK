services:
  db:
    image: mysql:8.0
    container_name: mybank_db_prod
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mybank}
      MYSQL_USER: ${MYSQL_USER:-mybank_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${MYSQL_USER:-mybank_user}", "-p${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mybank

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/jdsgsdhghs/mybank-backend:latest}
    container_name: mybank_backend_prod
    environment:
      APP_ENV: prod
      APP_DEBUG: 0
      APP_SECRET: ${APP_SECRET}
      DATABASE_URL: "mysql://${MYSQL_USER:-mybank_user}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE:-mybank}?serverVersion=8.0&charset=utf8mb4"
      JWT_PASSPHRASE: ${JWT_PASSPHRASE}
      CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN:-^https?://localhost(:[0-9]+)?$$}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - mybank
    entrypoint: ["/bin/sh", "/var/www/html/docker-entrypoint.sh"]
    command: ["php-fpm"]

  nginx:
    image: nginx:1.27-alpine
    container_name: mybank_nginx_prod
    ports:
      - "${BACKEND_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - mybank

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/jdsgsdhghs/mybank-frontend:latest}
    container_name: mybank_frontend_prod
    ports:
      - "${FRONTEND_PORT:-80}:80"
    restart: unless-stopped
    networks:
      - mybank

volumes:
  db_data:

networks:
  mybank:
    driver: bridge
