# ============================================================================
# MyBank — production AUTO-HÉBERGÉE (alternative à Render, même architecture)
#
# Services : backend (PHP-FPM) + nginx. AUCUNE base de données conteneurisée :
# DATABASE_URL pointe vers le MySQL managé (le même que celui utilisé par
# Render). Le frontend est servi par Vercel, jamais par ce compose.
#
#   cp .env.prod.example .env  → remplir les secrets
#   docker compose -f docker-compose.prod.yml up -d --build
# ============================================================================

name: mybank-prod

services:
  backend:
    build:
      context: ./backend
      target: prod
    image: mybank-backend:prod
    container_name: mybank_backend_prod
    restart: unless-stopped
    environment:
      APP_ENV: prod
      APP_DEBUG: 0
      APP_SECRET: ${APP_SECRET:?APP_SECRET requis}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL requis (MySQL managé)}
      JWT_PASSPHRASE: ${JWT_PASSPHRASE:?JWT_PASSPHRASE requis}
      JWT_PRIVATE_KEY_BASE64: ${JWT_PRIVATE_KEY_BASE64:-}
      JWT_PUBLIC_KEY_BASE64: ${JWT_PUBLIC_KEY_BASE64:-}
      CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN:?CORS_ALLOW_ORIGIN requis}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-127.0.0.1,REMOTE_ADDR}
    healthcheck:
      test: ["CMD-SHELL", "php bin/console dbal:run-sql 'SELECT 1' > /dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - mybank

  nginx:
    image: nginx:1.27-alpine
    container_name: mybank_nginx_prod
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8080}:80"
    volumes:
      # Nginx n'a besoin que du front controller pour résoudre les chemins
      # FastCGI ; le code applicatif vit dans l'image backend.
      - ./backend/public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/api/health | grep -q ok"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - mybank

networks:
  mybank:
    driver: bridge
