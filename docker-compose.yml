services:
  db:
    image: mysql:8.0
    container_name: mybank_db
    environment:
      MYSQL_DATABASE: mybank
      MYSQL_USER: mybank_user
      MYSQL_PASSWORD: mybank
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "mybank_user", "-pmybank"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - mybank

  backend:
    build:
      context: ./backend
      target: dev
    container_name: mybank_backend
    environment:
      APP_ENV: dev
      APP_DEBUG: 1
      DATABASE_URL: "mysql://mybank_user:mybank@db:3306/mybank?serverVersion=8.0&charset=utf8mb4"
      JWT_PASSPHRASE: mybank_jwt_passphrase
      CORS_ALLOW_ORIGIN: '^https?://(localhost|127\.0\.0\.1)(:[0-9]+)?$$'
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
    depends_on:
      db:
        condition: service_healthy
    networks:
      - mybank
    entrypoint: ["/bin/sh", "/var/www/html/docker-entrypoint.sh"]
    command: ["php-fpm"]

  nginx:
    image: nginx:1.27-alpine
    container_name: mybank_nginx
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - mybank

  frontend:
    build:
      context: ./frontend
      target: dev
    container_name: mybank_frontend
    environment:
      VITE_API_URL: http://localhost:8080/api
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - mybank
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]

volumes:
  db_data:
  backend_vendor:
  frontend_node_modules:

networks:
  mybank:
    driver: bridge
