# ============================================================================
# MyBank — environnement de DÉVELOPPEMENT
#
#   docker compose up -d          → API sur http://localhost:8080/api
#   phpMyAdmin                    → http://localhost:8081
#   Frontend : lancé en local     → cd frontend && npm run dev (port 5173)
#
# La production n'utilise PAS ce fichier (Render + Vercel + MySQL managé).
# ============================================================================

name: mybank

services:
  db:
    image: mysql:8.0
    container_name: mybank_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: mybank
      MYSQL_USER: mybank_user
      MYSQL_PASSWORD: mybank
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "mybank_user", "-pmybank"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - mybank

  backend:
    build:
      context: ./backend
      target: dev
    container_name: mybank_backend
    restart: unless-stopped
    environment:
      APP_ENV: dev
      APP_DEBUG: 1
      DATABASE_URL: "mysql://mybank_user:mybank@db:3306/mybank?serverVersion=8.0&charset=utf8mb4"
      JWT_PASSPHRASE: mybank_jwt_passphrase
      CORS_ALLOW_ORIGIN: '^https?://(localhost|127\.0\.0\.1)(:[0-9]+)?$$'
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(0);'"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - mybank
    entrypoint: ["/bin/sh", "/var/www/html/docker-entrypoint.sh"]
    command: ["php-fpm"]

  nginx:
    image: nginx:1.27-alpine
    container_name: mybank_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/api/health | grep -q ok"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - mybank

  phpmyadmin:
    image: phpmyadmin:5
    container_name: mybank_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_USER: mybank_user
      PMA_PASSWORD: mybank
      UPLOAD_LIMIT: 32M
    ports:
      - "8081:80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - mybank

volumes:
  db_data:
  backend_vendor:

networks:
  mybank:
    driver: bridge
