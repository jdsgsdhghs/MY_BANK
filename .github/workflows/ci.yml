name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-tests:
    name: Backend - PHPUnit + integration
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: mybank_test
          MYSQL_USER: mybank_user
          MYSQL_PASSWORD: mybank
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h localhost -u mybank_user -pmybank"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: intl, pdo_mysql, zip, apcu
          coverage: none
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ hashFiles('backend/composer.lock', 'backend/composer.json') }}
          restore-keys: composer-

      - name: Install Composer dependencies
        working-directory: backend
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Generate JWT keys
        working-directory: backend
        run: |
          mkdir -p config/jwt
          openssl genpkey -out config/jwt/private.pem -aes256 -algorithm rsa -pkeyopt rsa_keygen_bits:4096 -pass pass:mybank_jwt_passphrase
          openssl pkey -in config/jwt/private.pem -out config/jwt/public.pem -pubout -passin pass:mybank_jwt_passphrase

      - name: Create test database schema
        working-directory: backend
        env:
          DATABASE_URL: "mysql://mybank_user:mybank@127.0.0.1:3306/mybank_test?serverVersion=8.0&charset=utf8mb4"
          APP_ENV: test
          JWT_PASSPHRASE: mybank_jwt_passphrase
        run: |
          php bin/console doctrine:database:create --if-not-exists --no-interaction --env=test || true
          php bin/console doctrine:schema:create --no-interaction --env=test || \
            php bin/console doctrine:schema:update --force --no-interaction --env=test

      - name: Run PHPUnit
        working-directory: backend
        env:
          DATABASE_URL: "mysql://mybank_user:mybank@127.0.0.1:3306/mybank_test?serverVersion=8.0&charset=utf8mb4"
          APP_ENV: test
          JWT_PASSPHRASE: mybank_jwt_passphrase
        run: vendor/bin/phpunit --testdox

  frontend-tests:
    name: Frontend - Vitest + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Lint
        working-directory: frontend
        run: npm run lint
        continue-on-error: true

      - name: Test
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npm run build

  docker-build:
    name: Docker - build images
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          target: prod
          tags: mybank-backend:ci
          load: true
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          target: prod
          tags: mybank-frontend:ci
          load: true
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
