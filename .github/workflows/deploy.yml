# ============================================================================
# MyBank — CI/CD
#
# Vérifie la qualité avant que Render et Vercel (connectés au repo GitHub,
# auto-deploy sur main) ne déploient :
#   1. backend-tests   : PHPUnit + intégration contre MySQL 8
#   2. frontend-tests  : Vitest + lint + build Vite
#   3. docker-build    : build des stages prod & render du Dockerfile Symfony
#
# Le déploiement lui-même est déclenché par GitHub → Render / GitHub → Vercel.
# ============================================================================

name: Deploy

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-tests:
    name: Backend — PHPUnit
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: mybank_test
          MYSQL_USER: mybank_user
          MYSQL_PASSWORD: mybank
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h localhost -u mybank_user -pmybank"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: test
      DATABASE_URL: "mysql://mybank_user:mybank@127.0.0.1:3306/mybank_test?serverVersion=8.0&charset=utf8mb4"
      JWT_PASSPHRASE: ci_jwt_passphrase

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: intl, pdo_mysql, zip, apcu
          coverage: none
          tools: composer:v2

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        working-directory: backend
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Generate JWT keys (CI only)
        working-directory: backend
        run: |
          mkdir -p config/jwt
          openssl genpkey -out config/jwt/private.pem -aes256 -algorithm rsa -pkeyopt rsa_keygen_bits:4096 -pass pass:$JWT_PASSPHRASE
          openssl pkey -in config/jwt/private.pem -out config/jwt/public.pem -pubout -passin pass:$JWT_PASSPHRASE

      - name: Create test schema
        working-directory: backend
        run: |
          php bin/console doctrine:database:create --if-not-exists --no-interaction --env=test || true
          php bin/console doctrine:schema:create --no-interaction --env=test || \
            php bin/console doctrine:schema:update --force --complete --no-interaction --env=test

      - name: Run PHPUnit
        working-directory: backend
        run: vendor/bin/phpunit --testdox

  frontend-tests:
    name: Frontend — Vitest + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Test
        working-directory: frontend
        run: npm test

      - name: Build (vérification Vercel)
        working-directory: frontend
        env:
          VITE_API_URL: https://mybank-backend.onrender.com/api
        run: npm run build

  docker-build:
    name: Docker — build image Symfony
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build stage prod (compose auto-hébergé)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: prod
          tags: mybank-backend:prod-ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build stage render (image Render)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: render
          tags: mybank-backend:render-ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
