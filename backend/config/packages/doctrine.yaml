doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'
    orm:
        default_entity_manager: default
        entity_managers:
            default:
                validate_xml_mapping: true
                naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
                auto_mapping: true
                mappings:
                    App:
                        type: attribute
                        is_bundle: false
                        dir: '%kernel.project_dir%/src/Entity'
                        prefix: 'App\Entity'
                        alias: App

when@prod:
    doctrine:
        # MySQL managé avec TLS obligatoire (ex. Aiven) : déposer le certificat
        # CA du fournisseur en « Secret File » Render (/etc/secrets/ca.pem),
        # définir DATABASE_SSL_CA=/etc/secrets/ca.pem puis décommenter :
        # dbal:
        #     options:
        #         # PDO::MYSQL_ATTR_SSL_CA
        #         1009: '%env(DATABASE_SSL_CA)%'
        orm:
            entity_managers:
                default:
                    query_cache_driver:
                        type: pool
                        pool: doctrine.system_cache_pool
                    result_cache_driver:
                        type: pool
                        pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
