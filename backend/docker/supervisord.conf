; ============================================================================
; Supervisord — orchestre nginx + PHP-FPM dans le conteneur Render.
; Si l'un des deux meurt, le conteneur s'arrête et Render le relance.
; ============================================================================
[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:php-fpm]
command=php-fpm -F
autostart=true
autorestart=true
startretries=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
startretries=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Arrêt propre de tout le conteneur si un process abandonne.
[eventlistener:quit_on_failure]
command=sh -c 'printf "READY\n"; while read -r line; do kill -SIGTERM 1; printf "RESULT 2\nOK"; done'
events=PROCESS_STATE_FATAL
