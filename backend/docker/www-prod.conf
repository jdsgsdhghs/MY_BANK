; ============================================================================
; PHP-FPM — pool production MyBank
; Dimensionné pour un conteneur 512 Mo (offre gratuite Render).
; ============================================================================
[www]
user = www-data
group = www-data

listen = 127.0.0.1:9000

pm = dynamic
pm.max_children = 8
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500

; Logs vers stdout/stderr (capturés par Render / docker logs).
access.log = /proc/self/fd/2
catch_workers_output = yes
decorate_workers_output = no

; Tue les requêtes bloquées au-delà de 35 s (filet de sécurité).
request_terminate_timeout = 35s
