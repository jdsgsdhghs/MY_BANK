<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="tri" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 Z" fill="#fff" stroke="#444"/>
    </marker>
  </defs>
  <rect width="900" height="560" fill="#ffffff"/>
  <text x="30" y="38" font-size="20" font-weight="bold" fill="#222">Diagramme de cas d'utilisation — MyBank</text>

  <!-- System boundary -->
  <rect x="300" y="70" width="560" height="460" rx="6" fill="#fafafa" stroke="#888"/>
  <text x="580" y="92" font-size="14" font-weight="bold" fill="#666" text-anchor="middle">MyBank</text>

  <!-- ===== Actor: User ===== -->
  <g stroke="#333" stroke-width="2" fill="none">
    <circle cx="110" cy="150" r="16" fill="#fff"/>
    <line x1="110" y1="166" x2="110" y2="210"/>
    <line x1="80" y1="182" x2="140" y2="182"/>
    <line x1="110" y1="210" x2="86" y2="245"/>
    <line x1="110" y1="210" x2="134" y2="245"/>
  </g>
  <text x="110" y="270" font-size="13" font-weight="bold" fill="#333" text-anchor="middle">Utilisateur</text>

  <!-- ===== Actor: Admin ===== -->
  <g stroke="#A11A2E" stroke-width="2" fill="none">
    <circle cx="110" cy="380" r="16" fill="#fff"/>
    <line x1="110" y1="396" x2="110" y2="440"/>
    <line x1="80" y1="412" x2="140" y2="412"/>
    <line x1="110" y1="440" x2="86" y2="475"/>
    <line x1="110" y1="440" x2="134" y2="475"/>
  </g>
  <text x="110" y="500" font-size="13" font-weight="bold" fill="#A11A2E" text-anchor="middle">Administrateur</text>

  <!-- Generalization Admin --|> User -->
  <line x1="110" y1="356" x2="110" y2="292" stroke="#444" stroke-width="1.5" marker-end="url(#tri)"/>
  <text x="120" y="326" font-size="10" fill="#777">hérite de</text>

  <!-- ===== Use cases: User ===== -->
  <g>
    <ellipse cx="455" cy="130" rx="95" ry="24" fill="#fff" stroke="#555"/><text x="455" y="135" font-size="12" fill="#333" text-anchor="middle">S'inscrire</text>
    <ellipse cx="455" cy="185" rx="95" ry="24" fill="#fff" stroke="#555"/><text x="455" y="190" font-size="12" fill="#333" text-anchor="middle">Se connecter</text>
    <ellipse cx="455" cy="240" rx="95" ry="24" fill="#fff" stroke="#555"/><text x="455" y="245" font-size="12" fill="#333" text-anchor="middle">Gérer ses opérations</text>
    <ellipse cx="455" cy="295" rx="95" ry="24" fill="#fff" stroke="#555"/><text x="455" y="300" font-size="12" fill="#333" text-anchor="middle">Gérer ses catégories</text>
    <ellipse cx="455" cy="350" rx="95" ry="24" fill="#fff" stroke="#555"/><text x="455" y="355" font-size="12" fill="#333" text-anchor="middle">Modifier son profil</text>
    <ellipse cx="455" cy="405" rx="95" ry="24" fill="#fff" stroke="#555"/><text x="455" y="410" font-size="12" fill="#333" text-anchor="middle">Se déconnecter</text>
  </g>

  <!-- ===== Use cases: Admin ===== -->
  <g>
    <ellipse cx="725" cy="200" rx="95" ry="24" fill="#fbf2f3" stroke="#A11A2E"/><text x="725" y="205" font-size="12" fill="#333" text-anchor="middle">Lister les utilisateurs</text>
    <ellipse cx="725" cy="255" rx="95" ry="24" fill="#fbf2f3" stroke="#A11A2E"/><text x="725" y="260" font-size="12" fill="#333" text-anchor="middle">Créer un utilisateur</text>
    <ellipse cx="725" cy="310" rx="95" ry="24" fill="#fbf2f3" stroke="#A11A2E"/><text x="725" y="315" font-size="12" fill="#333" text-anchor="middle">Modifier un utilisateur</text>
    <ellipse cx="725" cy="365" rx="95" ry="24" fill="#fbf2f3" stroke="#A11A2E"/><text x="725" y="370" font-size="12" fill="#333" text-anchor="middle">Supprimer un utilisateur</text>
  </g>

  <!-- Links User actor -> user use cases -->
  <g stroke="#999" stroke-width="1">
    <line x1="134" y1="230" x2="360" y2="132"/>
    <line x1="134" y1="232" x2="360" y2="186"/>
    <line x1="134" y1="235" x2="360" y2="240"/>
    <line x1="134" y1="238" x2="360" y2="295"/>
    <line x1="134" y1="240" x2="360" y2="349"/>
    <line x1="134" y1="242" x2="360" y2="403"/>
  </g>

  <!-- Links Admin actor -> admin use cases -->
  <g stroke="#A11A2E" stroke-width="1">
    <line x1="134" y1="455" x2="632" y2="206"/>
    <line x1="134" y1="458" x2="632" y2="258"/>
    <line x1="134" y1="460" x2="632" y2="312"/>
    <line x1="134" y1="462" x2="632" y2="366"/>
  </g>

  <text x="300" y="552" font-size="11" fill="#999">Un administrateur hérite de tous les cas d'utilisation de l'utilisateur, plus la gestion des comptes. Règle : il ne peut pas supprimer son propre compte.</text>
</svg>
