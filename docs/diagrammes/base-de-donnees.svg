<svg xmlns="http://www.w3.org/2000/svg" width="920" height="470" viewBox="0 0 920 470" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="dbarr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#444"/>
    </marker>
  </defs>
  <rect width="920" height="470" fill="#ffffff"/>
  <text x="30" y="38" font-size="20" font-weight="bold" fill="#222">Schéma de la base de données (MLD) — MySQL 8</text>

  <!-- ===== user ===== -->
  <g>
    <rect x="50" y="120" width="240" height="140" fill="#fff" stroke="#444" stroke-width="1.5"/>
    <rect x="50" y="120" width="240" height="28" fill="#A11A2E"/>
    <text x="170" y="139" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">user</text>
    <text x="62" y="170" font-size="11" fill="#333"><tspan font-weight="bold">🔑 id</tspan>        INT PK AUTO_INCREMENT</text>
    <text x="62" y="194" font-size="11" fill="#333">email     VARCHAR(180) UNIQUE</text>
    <text x="62" y="218" font-size="11" fill="#333">roles     JSON</text>
    <text x="62" y="242" font-size="11" fill="#333">password  VARCHAR(255)</text>
  </g>

  <!-- ===== operation ===== -->
  <g>
    <rect x="360" y="100" width="270" height="190" fill="#fff" stroke="#444" stroke-width="1.5"/>
    <rect x="360" y="100" width="270" height="28" fill="#555"/>
    <text x="495" y="119" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">operation</text>
    <text x="372" y="150" font-size="11" fill="#333"><tspan font-weight="bold">🔑 id</tspan>          INT PK AUTO_INCREMENT</text>
    <text x="372" y="174" font-size="11" fill="#333">label        VARCHAR(150)</text>
    <text x="372" y="198" font-size="11" fill="#333">amount       DECIMAL(12,2)</text>
    <text x="372" y="222" font-size="11" fill="#333">date         DATE</text>
    <text x="372" y="246" font-size="11" fill="#333"><tspan fill="#A11A2E">🔗 owner_id</tspan>    INT NOT NULL FK</text>
    <text x="372" y="270" font-size="11" fill="#333"><tspan fill="#A11A2E">🔗 category_id</tspan> INT NULL FK</text>
  </g>

  <!-- ===== category ===== -->
  <g>
    <rect x="690" y="150" width="210" height="120" fill="#fff" stroke="#444" stroke-width="1.5"/>
    <rect x="690" y="150" width="210" height="28" fill="#555"/>
    <text x="795" y="169" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">category</text>
    <text x="702" y="200" font-size="11" fill="#333"><tspan font-weight="bold">🔑 id</tspan>        INT PK AUTO_INCREMENT</text>
    <text x="702" y="224" font-size="11" fill="#333">title     VARCHAR(100)</text>
    <text x="702" y="248" font-size="11" fill="#333"><tspan fill="#A11A2E">🔗 owner_id</tspan>  INT NOT NULL FK</text>
  </g>

  <!-- Relations -->
  <!-- user 1 - * operation (owner_id) -->
  <line x1="290" y1="190" x2="360" y2="190" stroke="#444" stroke-width="1.5" marker-end="url(#dbarr)"/>
  <text x="300" y="183" font-size="10" fill="#666">1</text>
  <text x="345" y="183" font-size="10" fill="#666">∗</text>

  <!-- category 1 - * operation (category_id) -->
  <line x1="690" y1="240" x2="632" y2="262" stroke="#444" stroke-width="1.5" marker-end="url(#dbarr)"/>
  <text x="668" y="234" font-size="10" fill="#666">1</text>
  <text x="640" y="258" font-size="10" fill="#666">∗</text>
  <text x="636" y="290" font-size="9" fill="#888">ON DELETE SET NULL</text>

  <!-- user 1 - * category (owner_id) -->
  <path d="M210,260 C 230,360 760,360 795,278" fill="none" stroke="#444" stroke-width="1.5" marker-end="url(#dbarr)"/>
  <text x="216" y="280" font-size="10" fill="#666">1</text>
  <text x="780" y="296" font-size="10" fill="#666">∗</text>
  <text x="450" y="356" font-size="10" fill="#888">owner_id</text>

  <text x="30" y="420" font-size="11" fill="#999">Clés étrangères : operation.owner_id → user.id, operation.category_id → category.id (nullable, SET NULL), category.owner_id → user.id.</text>
  <text x="30" y="438" font-size="11" fill="#999">Moteur InnoDB, encodage utf8mb4. Index unique sur user.email ; les FK sont indexées automatiquement.</text>
</svg>
