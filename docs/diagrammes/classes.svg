<svg xmlns="http://www.w3.org/2000/svg" width="920" height="480" viewBox="0 0 920 480" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="diamond" markerWidth="18" markerHeight="12" refX="16" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,6 L8,1 L16,6 L8,11 Z" fill="#444"/>
    </marker>
  </defs>
  <rect width="920" height="480" fill="#ffffff"/>
  <text x="30" y="38" font-size="20" font-weight="bold" fill="#222">Diagramme de classes — MyBank</text>

  <!-- ===== User ===== -->
  <g>
    <rect x="50" y="120" width="240" height="210" fill="#fff" stroke="#444" stroke-width="1.5"/>
    <rect x="50" y="120" width="240" height="26" fill="#fbf2f3" stroke="#444" stroke-width="1.5"/>
    <text x="170" y="138" font-size="13" font-weight="bold" fill="#A11A2E" text-anchor="middle">User</text>
    <line x1="50" y1="146" x2="290" y2="146" stroke="#444"/>
    <text x="60" y="166" font-size="11" fill="#333">- id : int</text>
    <text x="60" y="184" font-size="11" fill="#333">- email : string (unique)</text>
    <text x="60" y="202" font-size="11" fill="#333">- password : string (hash)</text>
    <text x="60" y="220" font-size="11" fill="#333">- roles : string[]</text>
    <text x="60" y="236" font-size="10" fill="#888">  (ROLE_USER | ROLE_ADMIN)</text>
    <line x1="50" y1="248" x2="290" y2="248" stroke="#444"/>
    <text x="60" y="268" font-size="11" fill="#333">+ getRoles() / setRoles()</text>
    <text x="60" y="286" font-size="11" fill="#333">+ getUserIdentifier()</text>
    <text x="60" y="304" font-size="11" fill="#333">+ getEmail() / setEmail()</text>
  </g>

  <!-- ===== Operation ===== -->
  <g>
    <rect x="360" y="110" width="250" height="250" fill="#fff" stroke="#444" stroke-width="1.5"/>
    <rect x="360" y="110" width="250" height="26" fill="#eef0f2" stroke="#444" stroke-width="1.5"/>
    <text x="485" y="128" font-size="13" font-weight="bold" fill="#333" text-anchor="middle">Operation</text>
    <line x1="360" y1="136" x2="610" y2="136" stroke="#444"/>
    <text x="370" y="156" font-size="11" fill="#333">- id : int</text>
    <text x="370" y="174" font-size="11" fill="#333">- label : string</text>
    <text x="370" y="192" font-size="11" fill="#333">- amount : decimal(12,2)</text>
    <text x="370" y="210" font-size="11" fill="#333">- date : date</text>
    <text x="370" y="228" font-size="11" fill="#333">- owner : User</text>
    <text x="370" y="246" font-size="11" fill="#333">- category : Category [0..1]</text>
    <line x1="360" y1="258" x2="610" y2="258" stroke="#444"/>
    <text x="370" y="278" font-size="11" fill="#333">+ getLabel() / setLabel()</text>
    <text x="370" y="296" font-size="11" fill="#333">+ getAmount() / setAmount()</text>
    <text x="370" y="314" font-size="11" fill="#333">+ getDate() / setDate()</text>
    <text x="370" y="332" font-size="11" fill="#333">+ getCategory() / setCategory()</text>
  </g>

  <!-- ===== Category ===== -->
  <g>
    <rect x="690" y="150" width="200" height="160" fill="#fff" stroke="#444" stroke-width="1.5"/>
    <rect x="690" y="150" width="200" height="26" fill="#eef0f2" stroke="#444" stroke-width="1.5"/>
    <text x="790" y="168" font-size="13" font-weight="bold" fill="#333" text-anchor="middle">Category</text>
    <line x1="690" y1="176" x2="890" y2="176" stroke="#444"/>
    <text x="700" y="196" font-size="11" fill="#333">- id : int</text>
    <text x="700" y="214" font-size="11" fill="#333">- title : string</text>
    <text x="700" y="232" font-size="11" fill="#333">- owner : User</text>
    <line x1="690" y1="244" x2="890" y2="244" stroke="#444"/>
    <text x="700" y="264" font-size="11" fill="#333">+ getTitle()</text>
    <text x="700" y="282" font-size="11" fill="#333">+ setTitle()</text>
  </g>

  <!-- ===== Relations ===== -->
  <!-- User 1 -- * Operation (composition, owner) -->
  <line x1="290" y1="210" x2="360" y2="210" stroke="#444" stroke-width="1.5" marker-start="url(#diamond)"/>
  <text x="298" y="202" font-size="10" fill="#666">1</text>
  <text x="340" y="202" font-size="10" fill="#666">*</text>
  <text x="300" y="226" font-size="10" fill="#888">possède</text>

  <!-- User 1 -- * Category (composition, owner) -->
  <path d="M290,290 C 340,360 620,360 690,290" fill="none" stroke="#444" stroke-width="1.5" marker-start="url(#diamond)"/>
  <text x="300" y="312" font-size="10" fill="#666">1</text>
  <text x="672" y="305" font-size="10" fill="#666">*</text>
  <text x="450" y="372" font-size="10" fill="#888">possède</text>

  <!-- Operation * -- 0..1 Category (association, optional) -->
  <line x1="610" y1="235" x2="690" y2="235" stroke="#444" stroke-width="1.5"/>
  <text x="616" y="228" font-size="10" fill="#666">*</text>
  <text x="668" y="228" font-size="10" fill="#666">0..1</text>

  <text x="30" y="440" font-size="11" fill="#999">Multiplicités : 1 User → 0..* Operation et 0..* Category (composition, orphanRemoval). 1 Category ← 0..* Operation (association optionnelle, ON DELETE SET NULL).</text>
</svg>
