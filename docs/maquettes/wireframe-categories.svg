<svg xmlns="http://www.w3.org/2000/svg" width="860" height="560" viewBox="0 0 860 560" font-family="Arial, Helvetica, sans-serif">
  <rect width="860" height="560" fill="#ffffff"/>
  <text x="30" y="36" font-size="20" font-weight="bold" fill="#222">Wireframe — Categories</text>
  <text x="30" y="56" font-size="12" fill="#777">Écran protégé. Création/édition de catégories + liste.</text>

  <rect x="30" y="75" width="800" height="460" fill="#fafafa" stroke="#333" stroke-width="2"/>

  <!-- Sidebar -->
  <rect x="30" y="75" width="150" height="460" fill="#eef0f2" stroke="#c4c9ce"/>
  <circle cx="52" cy="103" r="10" fill="#cfd5da"/>
  <rect x="68" y="98" width="70" height="12" fill="#cfd5da"/>
  <rect x="46" y="140" width="118" height="26" fill="#d8dde2"/><text x="58" y="158" font-size="11" fill="#777">Operations</text>
  <rect x="46" y="172" width="118" height="26" fill="#cdd3d9"/><text x="58" y="190" font-size="11" fill="#555">Categories</text>
  <rect x="46" y="204" width="118" height="26" fill="#d8dde2"/><text x="58" y="222" font-size="11" fill="#777">Users</text>
  <rect x="46" y="236" width="118" height="26" fill="#d8dde2"/><text x="58" y="254" font-size="11" fill="#777">Profile</text>
  <line x1="46" y1="480" x2="164" y2="480" stroke="#c4c9ce"/>
  <circle cx="58" cy="505" r="9" fill="#d8dde2"/>
  <rect x="74" y="500" width="60" height="9" fill="#d8dde2"/>

  <!-- Header -->
  <text x="205" y="105" font-size="16" font-weight="bold" fill="#444">Categories</text>
  <text x="205" y="124" font-size="11" fill="#999">Organize your operations to better understand your spending.</text>

  <!-- New category form -->
  <rect x="205" y="140" width="610" height="90" fill="#fff" stroke="#dfe3e7"/>
  <text x="220" y="162" font-size="12" font-weight="bold" fill="#666">New category</text>
  <text x="220" y="184" font-size="10" fill="#777">Name</text>
  <rect x="220" y="190" width="430" height="36" fill="#fff" stroke="#c4c9ce"/><text x="228" y="213" font-size="10" fill="#b3b8bd">e.g. Subscriptions</text>
  <rect x="662" y="190" width="138" height="36" fill="#9aa0a6"/><text x="731" y="213" font-size="11" fill="#fff" text-anchor="middle">Add</text>

  <!-- List -->
  <rect x="205" y="244" width="610" height="270" fill="#fff" stroke="#dfe3e7"/>
  <text x="220" y="266" font-size="12" font-weight="bold" fill="#666">Your categories</text>
  <g>
    <line x1="220" y1="282" x2="800" y2="282" stroke="#eef0f2"/>
    <circle cx="232" cy="306" r="5" fill="#cfd5da"/><rect x="248" y="301" width="160" height="10" fill="#e2e6ea"/><rect x="744" y="298" width="18" height="16" fill="#e2e6ea"/><rect x="768" y="298" width="18" height="16" fill="#e2e6ea"/>
    <line x1="220" y1="330" x2="800" y2="330" stroke="#eef0f2"/>
    <circle cx="232" cy="354" r="5" fill="#cfd5da"/><rect x="248" y="349" width="160" height="10" fill="#e2e6ea"/><rect x="744" y="346" width="18" height="16" fill="#e2e6ea"/><rect x="768" y="346" width="18" height="16" fill="#e2e6ea"/>
    <line x1="220" y1="378" x2="800" y2="378" stroke="#eef0f2"/>
    <circle cx="232" cy="402" r="5" fill="#cfd5da"/><rect x="248" y="397" width="160" height="10" fill="#e2e6ea"/><rect x="744" y="394" width="18" height="16" fill="#e2e6ea"/><rect x="768" y="394" width="18" height="16" fill="#e2e6ea"/>
    <line x1="220" y1="426" x2="800" y2="426" stroke="#eef0f2"/>
    <circle cx="232" cy="450" r="5" fill="#cfd5da"/><rect x="248" y="445" width="160" height="10" fill="#e2e6ea"/><rect x="744" y="442" width="18" height="16" fill="#e2e6ea"/><rect x="768" y="442" width="18" height="16" fill="#e2e6ea"/>
