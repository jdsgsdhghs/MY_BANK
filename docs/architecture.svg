<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#555"/>
    </marker>
    <marker id="arrowB" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#A11A2E"/>
    </marker>
  </defs>

  <rect width="1000" height="660" fill="#ffffff"/>
  <text x="40" y="44" font-size="24" font-weight="bold" fill="#222">MyBank — Architecture de l'application</text>
  <text x="40" y="68" font-size="13" fill="#777">Architecture découplée : frontend statique + API REST stateless + base de données managée. Déploiement automatisé (CI/CD).</text>

  <!-- ===================== UTILISATEUR ===================== -->
  <rect x="40" y="150" width="150" height="90" rx="10" fill="#fff" stroke="#444" stroke-width="2"/>
  <text x="115" y="185" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">Utilisateur</text>
  <text x="115" y="206" font-size="11" fill="#888" text-anchor="middle">Navigateur web</text>
  <text x="115" y="222" font-size="11" fill="#888" text-anchor="middle">(SPA React)</text>

  <!-- ===================== VERCEL (FRONTEND) ===================== -->
  <rect x="300" y="90" width="230" height="110" rx="10" fill="#fff" stroke="#A11A2E" stroke-width="2"/>
  <rect x="300" y="90" width="230" height="28" rx="10" fill="#A11A2E"/>
  <text x="415" y="109" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">Vercel — Frontend</text>
  <text x="415" y="142" font-size="12" fill="#444" text-anchor="middle">React 18 + TypeScript</text>
  <text x="415" y="160" font-size="12" fill="#444" text-anchor="middle">Build Vite (statique / CDN)</text>
  <text x="415" y="182" font-size="10" fill="#999" text-anchor="middle">VITE_API_URL → API</text>

  <!-- ===================== RENDER (BACKEND) ===================== -->
  <rect x="300" y="290" width="230" height="130" rx="10" fill="#fff" stroke="#A11A2E" stroke-width="2"/>
  <rect x="300" y="290" width="230" height="28" rx="10" fill="#A11A2E"/>
  <text x="415" y="309" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">Render — API REST</text>
  <text x="415" y="342" font-size="12" fill="#444" text-anchor="middle">Symfony 7.3 / PHP 8.2</text>
  <text x="415" y="360" font-size="12" fill="#444" text-anchor="middle">nginx + PHP-FPM (Docker)</text>
  <text x="415" y="382" font-size="11" fill="#666" text-anchor="middle">Doctrine ORM · stateless</text>
  <text x="415" y="402" font-size="10" fill="#999" text-anchor="middle">Health check : /api/health</text>

  <!-- ===================== MYSQL ===================== -->
  <rect x="640" y="290" width="230" height="130" rx="10" fill="#fff" stroke="#444" stroke-width="2"/>
  <rect x="640" y="290" width="230" height="28" rx="10" fill="#555"/>
  <text x="755" y="309" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">Base de données</text>
  <text x="755" y="344" font-size="12" fill="#444" text-anchor="middle">MySQL 8 managé</text>
  <text x="755" y="362" font-size="12" fill="#444" text-anchor="middle">(ex. Aiven)</text>
  <text x="755" y="392" font-size="11" fill="#666" text-anchor="middle">Tables : user, operation,</text>
  <text x="755" y="408" font-size="11" fill="#666" text-anchor="middle">category</text>

  <!-- ===================== FLECHES UTILISATEUR ===================== -->
  <!-- User -> Vercel (charge la SPA) -->
  <path d="M190,175 C 240,150 260,140 298,135" fill="none" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="210" y="128" font-size="10" fill="#666">HTTPS — charge l'app</text>

  <!-- User -> Render (appels API) -->
  <path d="M190,215 C 240,300 255,330 298,345" fill="none" stroke="#A11A2E" stroke-width="2" marker-end="url(#arrowB)"/>
  <text x="186" y="290" font-size="10" fill="#A11A2E">HTTPS /api + JWT</text>
  <text x="186" y="304" font-size="10" fill="#A11A2E">(JSON)</text>

  <!-- Render -> MySQL -->
  <path d="M530,355 L636,355" fill="none" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M636,375 L532,375" fill="none" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="545" y="348" font-size="10" fill="#666">SQL (TLS)</text>

  <!-- ===================== CI/CD ===================== -->
  <rect x="300" y="500" width="200" height="90" rx="10" fill="#f6f7f8" stroke="#444" stroke-width="2"/>
  <text x="400" y="528" font-size="13" font-weight="bold" fill="#333" text-anchor="middle">GitHub</text>
  <text x="400" y="550" font-size="11" fill="#777" text-anchor="middle">Code source (Git)</text>
  <text x="400" y="568" font-size="11" fill="#777" text-anchor="middle">branche main</text>

  <rect x="560" y="500" width="240" height="90" rx="10" fill="#f6f7f8" stroke="#444" stroke-width="2"/>
  <text x="680" y="528" font-size="13" font-weight="bold" fill="#333" text-anchor="middle">GitHub Actions — CI/CD</text>
  <text x="680" y="550" font-size="11" fill="#777" text-anchor="middle">Tests (PHPUnit + Vitest),</text>
  <text x="680" y="568" font-size="11" fill="#777" text-anchor="middle">lint, build, images Docker</text>

  <!-- push -->
  <path d="M500,545 L556,545" fill="none" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="505" y="538" font-size="10" fill="#666">push</text>

  <!-- auto-deploy vers Vercel et Render -->
  <path d="M560,520 C 470,470 440,300 432,202" fill="none" stroke="#888" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <path d="M620,500 C 560,470 500,450 470,422" fill="none" stroke="#888" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="690" y="470" font-size="10" fill="#888">auto-deploy (Vercel + Render)</text>

  <!-- ===================== ENCADRE SECURITE ===================== -->
  <rect x="640" y="90" width="320" height="150" rx="10" fill="#fbf2f3" stroke="#A11A2E" stroke-dasharray="4,3"/>
  <text x="660" y="116" font-size="13" font-weight="bold" fill="#A11A2E">Sécurité</text>
  <text x="660" y="140" font-size="11" fill="#555">• HTTPS / TLS de bout en bout</text>
  <text x="660" y="160" font-size="11" fill="#555">• Authentification JWT (RS256), API stateless</text>
  <text x="660" y="180" font-size="11" fill="#555">• Rôles ROLE_USER / ROLE_ADMIN</text>
  <text x="660" y="200" font-size="11" fill="#555">• CORS limité au domaine du frontend</text>
  <text x="660" y="220" font-size="11" fill="#555">• Secrets en variables d'environnement</text>

  <text x="40" y="630" font-size="11" fill="#999">Développement local : tous les services (MySQL, Symfony, nginx, phpMyAdmin, Vite) sont conteneurisés avec Docker Compose.</text>
</svg>
